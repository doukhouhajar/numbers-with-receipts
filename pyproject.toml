[project]
name = "groundwork"
version = "0.1.0"
description = "An agent that refuses to make up numbers, trustworthy by construction (quantum resource estimation)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
  # agent loop + typed spine
  "langgraph>=0.2",
  "langchain-ollama>=0.2",      # default local provider
  "langchain-openai>=0.2",      
  "pydantic>=2.7",
  "pydantic-settings>=2.3",     
  # grounded computation
  "pint>=0.24",                 # units / dimensional analysis
  "uncertainties>=3.2",         # error propagation
  "sympy>=1.13",                # symbolic derivations
  "numpy>=1.26",
  "scipy>=1.13",                # scipy.constants = sourced constants
  # sandboxed code execution
  "e2b-code-interpreter>=1.0",
  # quantum domain: Azure Quantum Resource Estimator (runs locally)
  "qsharp>=1.0",
  # service
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  # observability
  "langfuse>=3.0",           
]
[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.6",
  "mypy>=1.11",
  "inspect-ai>=0.3",           
]
crossverify = [
  "qualtran>=0.4",             
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["groundwork"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["Qualtran"]  

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]   # pycodestyle, pyflakes, isort, pyupgrade, bugbear
ignore = ["E501"]  

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]